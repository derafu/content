# Reuses shared rendering services and contributes only Content's templates.
# Markdown and PDF engines are optional; consumers import their Renderer YAML
# when those output formats are enabled.
imports:
    - { resource: '../../../renderer/resources/config/renderer-services.yaml' }
    - { resource: '../../../twig-components/resources/config/twig-components-twig-services.yaml' }

parameters:
    derafu.content.cache.namespace: derafu_content
    derafu.content.cache.default_lifetime: 60
    derafu.content.cache.directory: '%kernel.cache_dir%'

    derafu.content.config:
        title: 'Derafu Content'
        url: 'https://www.derafu.dev'
        plugins:
            academy: ~
            api: ~
            blog: ~
            docs: ~
            faq: ~
            # mcp: ~
            # pages: ~
            # search: ~
            sitemap: ~
            storage: ~

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # URL generation and route registration are supplied by the host stack.
    # Standalone apps import Routing's YAML; Symfony supplies its own adapters.
    Derafu\Content\Provider\ContentTemplatePathProvider:
        tags: ['derafu_twig.template_path_provider']

    Derafu\Content\Contract\ContentServiceInterface:
        class: Derafu\Content\ContentService

    # Content registry cache: same directory the rest of the app already
    # uses (var/cache/<env>/), so "clear the cache" means the same thing
    # everywhere and there is nothing extra to remember to clean up.
    Psr\Cache\CacheItemPoolInterface $content:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            $namespace: '%derafu.content.cache.namespace%'
            $defaultLifetime: '%derafu.content.cache.default_lifetime%'
            $directory: '%derafu.content.cache.directory%'

    Derafu\Content\Contract\ContentContextInterface:
        class: Derafu\Content\ContentContext
        arguments:
            $cache: '@Psr\Cache\CacheItemPoolInterface $content'

    Derafu\Content\Contract\ContentConfigInterface:
        class: Derafu\Content\ContentConfig
        arguments:
            $config: '%derafu.content.config%'

    Derafu\Content\Contract\PluginLoaderInterface:
        class: Derafu\Content\PluginLoader

    Derafu\Content\Contract\ContentLoaderInterface:
        class: Derafu\Content\ContentLoader
        arguments:
            $basePath: '%kernel.project_dir%'

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    Derafu\Content\Translation\ContentTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']

    Derafu\Content\Plugin\Academy\AcademyController:
        public: true

    Derafu\Content\Plugin\Api\ApiController:
        public: true

    Derafu\Content\Plugin\Blog\BlogController:
        public: true

    Derafu\Content\Plugin\Docs\DocsController:
        public: true

    Derafu\Content\Plugin\Faq\FaqController:
        public: true

    Derafu\Content\Plugin\Mcp\McpController:
        public: true

    Derafu\Content\Plugin\Pages\PagesController:
        public: true

    Derafu\Content\Plugin\Search\SearchController:
        public: true

    Derafu\Content\Plugin\Sitemap\SitemapController:
        public: true

    Derafu\Content\Plugin\Storage\StorageController:
        public: true
